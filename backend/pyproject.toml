[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infographicx"
version = "0.1.0"
description = "AI Knowledge Visualization Platform — transform any input into interactive visual knowledge systems"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "InfographicX Team", email = "team@infographicx.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "celery[redis]>=5.3.6",
    "httpx>=0.26.0",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "openpyxl>=3.2.0",
    "pypdf>=4.0.0",
    "pillow>=10.2.0",
    "aiofiles>=23.2.0",
    "redis>=5.0.1",
    "openai>=1.10.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.2",
    "networkx>=3.2.0",
    "numpy>=1.26.0",
    "whisper>=1.1.10",
    "yt-dlp>=2023.12.0",
    "beautifulsoup4>=4.12.0",
    "gitpython>=3.1.41",
    "weasyprint>=60.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "factory-boy>=3.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
